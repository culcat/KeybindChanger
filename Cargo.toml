[package]
name = "keybindchanger"
version = "0.1.0"
edition = "2024"
description = "A GUI to view, edit and create Hyprland keybindings"
license = "MIT"
repository = "https://github.com/culcat/KeybindChanger"
default-run = "keybindchanger"

[dependencies]
anyhow = "1"
gtk4 = { version = "0.11", features = ["v4_10"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
