[package]
name = "keybindchanger"
version = "0.1.0"
edition = "2024"
description = "A GUI to view, edit and create Hyprland keybindings"
license = "MIT"
repository = "https://github.com/culcat/KeybindChanger"
default-run = "keybindchanger"

[dependencies]
anyhow = "1"
eframe = { version = "0.37", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
